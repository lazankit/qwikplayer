# Use uosc's controls instead of mpv's built-in ones
osc=no
osd-bar=no
border=no
# Window opens at 70% of the screen, remembers where you stopped
keep-open=yes
save-position-on-quit=yes
# Preferred track languages
slang=en,eng
alang=en,eng

# Faster: GPU decoding/rendering via Direct3D 11, skip the YouTube loader at startup.
# The trailing comma after "gpu-next,gpu" keeps mpv's own autoprobe as the last resort, so if the
# first choices cannot start on a PC there is still video instead of a black window.
vo=gpu-next,gpu,
gpu-api=d3d11
hwdec=d3d11va
ytdl=no
# Cache only network streams (auto); local files are read normally instead of filling 150 MB of RAM.
cache=auto
demuxer-max-bytes=150MiB


# Volume can go up to 200% (boosts like VLC)
volume-max=200
# Window opens centred at 80% of the screen and keeps that shape; video is centred inside
autofit=80%
geometry=50%:50%
keepaspect-window=no
snap-window=yes

# ---- QwikPlayer branding ----
title=${?media-title:${media-title} - }QwikPlayer
osd-font=Poppins
osd-font-size=34
osd-color='#FFFFFF'
osd-border-color='#B0000000'
osd-border-size=1.5
osd-shadow-offset=1

# Load subtitles saved next to the video (e.g. ones downloaded with Find online)
sub-auto=fuzzy

# ---- Low-end quality profile ----
# Cheap scalers, no HDR peak detection. The app can also apply it by name (apply-profile qwik-fast) on
# machines it detects as low-end.
[qwik-fast]
profile=fast
hdr-compute-peak=no

# Switches itself on when a 1080p-or-larger video has to be decoded in software (no GPU decoding), which
# is when the CPU needs the relief, and back off when the condition no longer holds. PCs that decode on
# the GPU keep the full-quality defaults.
[qwik-auto-fast]
profile-cond=(p["hwdec-current"] or "no") == "no" and (p["video-params/h"] or 0) >= 1080
profile-restore=copy-equal
profile=qwik-fast
